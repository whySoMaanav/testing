fields:
  - name: category
    label: Category
    type: select
    required: true
    options:
      - Privacy
      - Security
      - Bias & Fairness
      - Performance
      - Compliance
      - Other
  - name: description
    label: Description
    type: textarea
    required: true
  - name: likelihood
    label: Likelihood
    type: radio
    required: true
    horizontal: true
    options:
      - Remote (1)
      - Unlikely (2)
      - Possible (3)
      - Likely (4)
      - Virtually Certain (5)
  - name: impact
    label: Impact
    type: radio
    required: true
    horizontal: true
    options:
      - Insignificant (1)
      - Minor (2)
      - Moderate (3)
      - High (4)
      - Very High (5)
  - name: status
    label: Status
    type: select
    required: true
    options:
      - Open
      - In Progress
      - Mitigated
      - Accepted
      - Closed
  - name: mitigation
    label: Mitigation
    type: textarea
    required: false
